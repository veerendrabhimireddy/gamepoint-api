services:
  - type: web
    name: gamepoint-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NETPLAY_TOKEN
        sync: false   # set the real token in the Render dashboard, not in git
