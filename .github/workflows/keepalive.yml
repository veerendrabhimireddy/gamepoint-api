name: keep-alive

# Render's free tier sleeps a service after ~15 minutes idle, and the first
# call after that takes 30-60s to wake — longer than the voice platform's 20s
# timeout, so the caller hears a failed lookup. Pinging every 10 minutes keeps
# the service warm.
#
# NOTE ON COST: scheduled workflows consume Actions minutes on PRIVATE repos.
# Every 10 min is ~4,300 runs/month, and each run bills a 1-minute minimum,
# which exceeds the 2,000 free minutes for private repos. On a PUBLIC repo
# Actions minutes are unlimited and this is genuinely free. See README.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}       # allows a manual run from the Actions tab

# Don't pile up runs if one is slow (e.g. a cold start).
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              https://gamepoint-api.onrender.com/health || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "service is awake"
              exit 0
            fi
            sleep 20
          done
          echo "::error::service did not respond 200 after 3 attempts"
          exit 1
